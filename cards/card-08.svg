<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1050" width="750" height="1050">
  <defs>
    <style type="text/css">
      @font-face {
        font-family: 'Cunning Display';
        font-weight: 800;
        src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
      }
